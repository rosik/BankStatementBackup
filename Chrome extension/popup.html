<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 240px;
        margin: 0;
        padding: 14px;
        font-size: 13px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
      }
      label {
        display: block;
        margin: 8px 0 3px;
        font-weight: 600;
      }
      input[type="date"] {
        width: 100%;
        box-sizing: border-box;
        padding: 5px 6px;
        font-size: 13px;
        border: 1px solid #c8c8c8;
        border-radius: 4px;
      }
      button {
        margin-top: 14px;
        width: 100%;
        padding: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #fff;
        background: #005bff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:disabled {
        background: #9bb8e8;
        cursor: default;
      }
      #status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: #444;
        white-space: pre-wrap;
      }
      .error {
        color: #c00;
      }
    </style>
  </head>
  <body>
    <h1>Ozon Bank — экспорт в CSV</h1>

    <label for="from">С даты</label>
    <input type="date" id="from" />

    <label for="to">По дату</label>
    <input type="date" id="to" />

    <button id="export">Выгрузить CSV</button>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
